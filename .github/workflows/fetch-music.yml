name: Fetch the music library

on:
  workflow_dispatch:       # run it from the Actions tab whenever you want to build or top up the library

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data          # one data job at a time across all three workflows, so they queue rather than push over each other
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24), pinned to its exact commit

      - name: Download Creative Commons tracks by Kevin MacLeod (incompetech.com)
        run: python3 scripts/fetch_music.py

      - name: Commit the library
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music data/music.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Music library: Creative Commons tracks by Kevin MacLeod"
            ok=0; for i in 1 2 3; do if git pull --rebase --autostash && git push; then ok=1; break; fi; sleep 10; done; [ "$ok" = 1 ]   # fail the job if it never got pushed
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
