name: Fetch the music library

on:
  workflow_dispatch:       # run it from the Actions tab whenever you want to build or top up the library

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Creative Commons tracks by Kevin MacLeod (incompetech.com)
        run: python3 scripts/fetch_music.py

      - name: Commit the library
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music data/music.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Music library: Creative Commons tracks by Kevin MacLeod"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
