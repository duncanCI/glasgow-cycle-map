name: Refresh collisions from the national data

on:
  workflow_dispatch:       # run from the Actions tab; the national data is published once a year (September)

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data          # one data job at a time across all three workflows, so they queue rather than push over each other
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24), pinned to its exact commit

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0, pinned to its exact commit
        with:
          python-version: '3.12'

      - name: Libraries the script uses
        run: python -m pip install --quiet numpy scipy shapely pyproj

      - name: Bike collisions for Glasgow and the area around it, from the DfT's national STATS19 data
        run: python scripts/refresh_collisions.py

      - name: Keep the page's security policy in step with its script
        run: python scripts/csp.py

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Collisions from the national STATS19 data"
            ok=0; for i in 1 2 3; do if git pull --rebase --autostash && git push; then ok=1; break; fi; sleep 10; done; [ "$ok" = 1 ]   # fail the job if it never got pushed
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
