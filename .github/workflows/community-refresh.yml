name: Weekly refresh of the community cycle map

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data          # one data job at a time across all three workflows, so they queue rather than push over each other
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24), pinned to its exact commit

      - name: Download the community map and embed it in the page
        run: python3 scripts/community.py

      - name: Keep the page's security policy in step with its script
        run: python3 scripts/csp.py

      - name: Refresh crossing evidence (OpenStreetMap crossings and the council's signal sites)
        run: python3 scripts/fetch_crossings.py || echo "Crossing refresh failed; keeping the previous file"

      - name: Commit the refresh
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/community.geojson data/community-meta.json data/crossings.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly refresh of the community cycle map and crossing data"
            ok=0; for i in 1 2 3; do if git pull --rebase --autostash && git push; then ok=1; break; fi; sleep 10; done; [ "$ok" = 1 ]   # fail the job if it never got pushed
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
